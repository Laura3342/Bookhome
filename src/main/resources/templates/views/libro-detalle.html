<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BookHome - Detalle del libro</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body>

<header>
    <h1>BookHome</h1>
    <p>Detalle del libro</p>
</header>

<nav>
    <a th:href="@{/}">Index</a>
    <a th:href="@{/home}">Home</a>
    <a th:href="@{/mis-libros}">Mis libros</a>
    <a th:href="@{/recomendaciones}">Recomendaciones</a>
</nav>

<main>
    <h2>Detalle del libro</h2>

    <div class="card" th:if="${libro != null}">
        <p><strong>Título:</strong> <span th:text="${libro.titulo}"></span></p>
        <p><strong>Autor:</strong> <span th:text="${libro.autor}"></span></p>
        <p><strong>Género:</strong> <span th:text="${libro.genero}"></span></p>
        <p><strong>Estado:</strong> <span th:text="${libro.estadoLectura}"></span></p>
        <p><strong>Puntuación:</strong> <span th:text="${libro.puntuacion}"></span></p>
        <p><strong>Favorito:</strong> <span th:text="${libro.favorito} ? 'Sí' : 'No'"></span></p>
        <p><strong>Comentario:</strong> <span th:text="${libro.comentario}"></span></p>
    </div>

    <div class="card" th:if="${libro == null}">
        <p>El libro no existe.</p>
    </div>

    <a class="button-link" th:href="@{/mis-libros}">Volver a mis libros</a>
</main>

<footer>
    <p>BookHome - Proyecto de gestión de lecturas</p>
</footer>

</body>
</html>
