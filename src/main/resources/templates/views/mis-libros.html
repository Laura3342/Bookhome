<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BookHome - Mis Libros</title>
    <link rel="stylesheet" th:href="@{/styles/style.css}">
</head>
<body>

<header>
    <h1>BookHome</h1>
    <p>Mi biblioteca personal</p>
</header>

<nav>
    <a th:href="@{/}">Index</a>
    <a th:href="@{/home}">Home</a>
    <a th:href="@{/mis-libros}">Mis libros</a>
    <a th:href="@{/recomendaciones}">Recomendaciones</a>
</nav>

<main>
    <h2>Mis libros</h2>
    <p>Aquí aparecerán los libros guardados en tu biblioteca.</p>

    <ul>
        <li th:each="libro : ${libros}">
            <a th:href="@{/libros/{id}(id=${libro.id})}" th:text="${libro.titulo}"></a>
            - <span th:text="${libro.autor}"></span>
            - <span th:text="${libro.estadoLectura}"></span>
        </li>
    </ul>
</main>

<footer>
    <p>BookHome - Proyecto de gestión de lecturas</p>
</footer>

</body>
</html>
